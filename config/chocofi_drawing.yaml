layout:
  zmk_keyboard: corne_rotated
  layout_name: LAYOUT_split_3x5_3

layers:
  DEF:
    - [Q, W, F, P, B, J, L, U, Y, {t: "'", s: '"'}]
    - [A, {h: Gui, t: R}, {h: Shift, t: S}, {h: Ctrl, t: T}, G, M, {h: Ctrl, t: N}, {h: Shift, t: E}, {h: Gui, t: I}, O]
    - [Z, X, C, {h: Alt, t: D}, V, K, {h: Alt, t: H}, {t: ',', s: ';'}, {t: ., s: ':'}, {t: /, s: '?'}]
    - [{type: layer, h: FUN, t: "[FUN]"}, {type: layer, h: SYM, t: "[SYM]"}, {h: Shift, t: "[Shift]", s: "CAPS WORD"}, {h: NUM, t: Enter}, {h: NAV, t: Space}, {h: MEDIA, t: Bspace}]
  NUM:
    - [null, null, null, null, null, "Kp  /", 7, 8, 9, "Kp  -"]
    - [null, Gui, Shift, Ctrl, null, 0, 4, 5, 6, .]
    - [null, null, null, Alt, null, "Kp  *", 1, 2, 3, "Kp  +"]
    - [null, null, null, {type: held}, null, null]
  SYM:
    - [null, '+', '{', '}', '|', '~', '<', '>', '_', {type: dead, t: '́◌'}]
    - ['@', {h: Gui, t: '='}, {h: Shift, t: '['}, {h: Ctrl, t: ']'}, '\', '`', {h: Ctrl, t: '('}, {h: Shift, t: ')'}, {h: Gui, t: '-'}, '!']
    - [null, '%', '#', {h: Alt, t: '*'}, null, null, {h: Alt, t: '^'}, '$', '&', {type: dead, t: '̈◌'}]
    - [null, {type: held}, DEF, Esc, Tab, Delete]
  NAV:
    - [null, null, null, null, null, Home, "Pg  Dn", "Pg  Up", End, Ins]
    - [null, Gui, Shift, Ctrl, null, '←', '↓', '↑', '→', Print]
    - [null, null, null, Alt, null, "Prev Tab", null, null, "Next Tab", "Context Menu"]
    - [null, null, null, null, {type: held}, null]
  FUN:
    - [null, null, null, null, {type: zmk, t: "USERNAME MACRO"}, F12, F7, F8, F9, null]
    - [null, "[Gui]", "[Shift]", "[Ctrl]", null, F11, F4, F5, F6, null]
    - [null, null, null, "[Alt]", null, F10, F1, F2, F3, null]
    - [{type: held}, null, DEF, "[AltGr]", "Caps Lock", "Num Lock"]
  MEDIA:
    - [null, null, null, null, null, '󰒮', '󰏤', '󰐊', '󰒭', '󰃬']
    - [null, null, null, {type: zmk, t: "SHOW BATT"}, null, '󰖁', '', '', '󰍭', '󱣴']
    - [null, null, null, {type: zmk, t: "SHOW CONN"}, null, null, '', '', null, '']
    - [null, null, null, null, null, {type: held}]
  (AltGr) DEF:
    - [{t: 'ä', s: 'Ä'}, {t: 'å', s: 'Å'}, null, {t: 'ö', s: 'Ö'}, {t: '·', s: ' ̵◌'}]
    - [{t: 'ï', s: 'Ï'}, {t: 'ø', s: 'Ø'}, {t: 'ú', s: 'Ú'}, {t: 'ü', s: 'Ü'}, {type: dead, t: '́◌', s: '̈◌'}]
    - [{t: 'á', s: 'Á'}, {t: 'ë', s: 'Ë'}, {t: 'ß', s: '§'}, {t: 'þ', s: 'Þ'}, null]
    - [{t: 'µ', s: '±'}, {t: 'ñ', s: 'Ñ'}, {t: 'é', s: 'É'}, {t: 'í', s: 'Í'}, {t: 'ó', s: 'Ó'}]
    - [{t: 'æ', s: 'Æ'}, {t: 'œ', s: 'Œ'}, {t: '©', s: '¢'}, {t: 'ð', s: 'Ð'}, {t: '®', s: '™'}]
    - [{t: 'œ', s: 'Œ'}, null, {t: 'ç', s: '¶'}, {type: t_dead, t: '̇◌', s: '°'}, {type: s_dead, t: '¿', s: '̉◌'}]
    - [null, null, {h: Shift, t: "[Shift]"}, null, null, null]
  (AltGr) NUM:
    - [null, null, null, null, null, null, {type: dead, t: '◌̛ '}, {type: dead, t: '̨◌'}, '‘', null]
    - [null, null, null, null, null, '’', '¤', '€', {type: dead, t: '̂◌'}, {type: dead, t: '̇◌'}]
    - [null, null, null, null, null, null, '¹', '²', '³', null]
    - [null, null, null, {type: held}, null, null]
  (AltGr) SYM:
    - [null, '÷', '“', '”', '¦', {type: dead, t: '̃◌'}, 'Ç', {type: dead, t: '̌◌'}, {type: dead, t: '̣◌'}, null]
    - [{type: dead, t: '̋◌'}, '×', '«', '»', '¬', {type: dead, t: '̀◌'}, {type: dead, t: '̆◌'}, {type: dead, t: '̊◌'}, '¥', '¡']
    - [null, {type: dead, t: '̧◌'}, {type: dead, t: '̄◌'}, '¾', null, null, '¼', '£', '½', null]
    - [null, {type: held}, null, null, null, null]
  MOUSE:
    - [null, null, null, null, null, null, "Scrl ↓", "↑", "Scrl ↑", null]
    - [null, "Gui", "Shift", "Ctrl", null, "Scrl ←", "←  ", "↓", "    →", "Scrl →"]
    - [null, null, null, "Alt", null, null, "MB4 Click", "Mid Click", "MB5 Click", null]
    - [null, {type: layer, t: "SLOW MOUSE"}, {type: layer, t: DEF}, "Left Click", {type: layer, t: "SLOW MOUSE"}, "Right Click"]
  CONF:
    - [null, null, null, null, null, {type: zmk, t: "OUT BLE"}, {type: zmk, t: "BT0"}, {type: zmk, t: "BT1"}, {type: zmk, t: "BT2"}, {type: zmk, t: "BT CLR"}]
    - [null, null, null, null, null, {type: zmk, t: "OUT USB"}, null, null, null, null]
    - [null, null, null, null, null, null, null, null, null, null]
    - [null, null, null, {type: layer, t: DEF}, null, null]
  Combos:
    - [null, null, null, null, null, null, null, null, null, null]
    - [null, null, null, null, null, null, null, null, null, null]
    - [null, null, null, null, null, null, null, null, null, null]
    - [null, null, null, null, null, null]

combos:
  - {p: [0, 1], k: Esc, l: ["Combos"], w: 40}
  - {p: [1, 2], k: Bspace, l: ["Combos"], w: 40}
  - {p: [2, 3], k: Delete, l: ["Combos"], w: 40}
  - {p: [3, 4], k: Enter, l: ["Combos"], w: 40}
  - {p: [10, 11], k: Space, l: ["Combos"], w: 40}
  - {p: [13, 14], k: Tab, l: ["Combos"], w: 40}
  - {p: [6, 7, 8], k: "[CONF]", l: ["Combos"], type: layer, a: "bottom", w: 45}
  - {p: [16, 17, 18], k: "MOUSE (DEF)", l: ["Combos"], type: layer, a: "bottom", w: 45, h: 28}

draw_config:
  key_w: 60
  key_h: 56
  split_gap: 30.0
  combo_w: 28
  combo_h: 26
  key_rx: 6.0
  key_ry: 6.0
  dark_mode: false
  n_columns: 2
  separate_combo_diagrams: false
  combo_diagrams_scale: 2
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 30.0
  outer_pad_h: 56.0
  line_spacing: 1.0
  arc_radius: 6.0
  append_colon_to_layer_header: true
  small_pad: 3.0
  legend_rel_x: 0.0
  legend_rel_y: 0.0
  draw_key_sides: false
  key_side_pars:
    rel_x: 0.0
    rel_y: 4.0
    rel_w: 12.0
    rel_h: 12.0
    rx: 4.0
    ry: 4.0
  svg_extra_style: 'svg.keymap { font-family: SFMono-Regular,Consolas,Liberation Mono,Menlo,Symbols Nerd Font,monospace; } text.hold { font-size: 10px; fill: #1b3dc4} text.layer-activator { fill: #147f1b; text-decoration: none; } text.layer { fill: #147f1b; } text.zmk { fill: #703d3d; } text.dead { font-size: 19px; } text.dead.shifted { font-size: 15px; } text.s_dead { font-size: 14px; } text.s_dead.shifted { font-size: 15px; } text.t_dead { font-size: 19px; } text.t_dead.shifted { font-size: 11px; } rect.combo { fill: #e0e9fc; } text.combo.layer { fill: #147f1b; } '
  footer_text: Created with <a href="https://github.com/caksoylar/keymap-drawer">keymap-drawer</a>
  shrink_wide_legends: 7
  style_layer_activators: true
  glyph_tap_size: 14
  glyph_hold_size: 12
  glyph_shifted_size: 10
  glyphs: {}
